zabbix_export:
  version: '7.4'

  template_groups:
  - uuid: 4918b88734c54bd094cff7585b5d71fc
    name: 'Templates/Network Devices'

  templates:
  - uuid: 6a1ef5e767cc4aba85c0d1712972eeb2
    template: 'Template pfSense Active OpenVPN Server User Auth'
    name: 'pfSense Active: OpenVPN Server User Auth'

    description: |
      OpenVPN Server User Authentication monitoring extension.

      Compatible with:
      - Zabbix 7.4
      - pfsense_zbx.php (repository root)
      - pfSense CE 2.7.x / 2.8.x

      Monitors individual OpenVPN server client sessions
      in user-authentication and TLS server modes.

      Features:
      - Connected client discovery
      - Bytes received and sent
      - Connection timestamp
      - Remote client address
      - Authenticated username
      - Assigned virtual IPv4 and IPv6 addresses
      - Client and peer identifiers

      Only currently connected clients are discovered.

      This extension is intended for OpenVPN servers
      supporting multiple authenticated client connections.

      Not intended for point-to-point shared-key VPNs.

      The extension has not yet been functionally tested
      against a User Auth/TLS server in this environment.

      https://github.com/rbicelli/pfsense-zabbix-template

    groups:
    - name: 'Templates/Network Devices'

    discovery_rules:
    - uuid: bae30f6a683e407aa9eeafbf9edb9179
      name: 'OpenVPN User Auth Connected Clients Discovery'
      type: ZABBIX_ACTIVE
      key: 'pfsense.discovery[openvpn_server_user]'
      delay: 60s

      lifetime_type: DELETE_AFTER
      lifetime: 7d

      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1h

      description: |
        Discovers currently connected clients on supported
        OpenVPN servers.

        PHP function:
        pfz_openvpn_server_userdiscovery()

        LLD macros:
        {#SERVERID}   - OpenVPN server identifier
        {#SERVERNAME} - OpenVPN server name
        {#UNIQUEID}   - Server ID and encoded common name
        {#USERID}     - Client common name

        Sessions that disappear from discovery are disabled
        after one hour and deleted after seven days.

        Discovery occurs every 60 seconds.

        Note:
        Session identity is based on server ID and common
        name, not on a unique connection instance.

      item_prototypes:

      # -------------------------------------------------
      # Traffic counters
      # -------------------------------------------------

      - uuid: 272166157ee4456b887e7df305167c2d
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Bytes Received'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},bytes_recv]'
        delay: 60s
        history: 30d
        trends: '0'
        units: B
        description: |
          Total bytes received for this OpenVPN client
          connection, as reported by pfSense.

          This is a session counter and may reset when
          the client reconnects.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      - uuid: 1acfb6c10d4d4a8d97281f37e757d3bf
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Bytes Sent'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},bytes_sent]'
        delay: 60s
        history: 30d
        trends: '0'
        units: B
        description: |
          Total bytes sent for this OpenVPN client
          connection, as reported by pfSense.

          This is a session counter and may reset when
          the client reconnects.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      # -------------------------------------------------
      # Connection information
      # -------------------------------------------------

      - uuid: 5f779a0e03b84be19030766d6fcffd92
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Connection Time'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},connect_time_unix]'
        delay: 60s
        history: 30d
        trends: '0'
        units: unixtime
        description: |
          Unix timestamp representing when the
          OpenVPN client connection was established.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      - uuid: 40b0a64862a44a99a33581b916ad6467
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Remote Host'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},remote_host]'
        delay: 60s
        history: 30d
        trends: '0'
        value_type: TEXT
        description: |
          Remote address reported for the connected
          OpenVPN client.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      - uuid: 8e1b6f2d8397483d8a2768babd93a1a7
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: User Name'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},user_name]'
        delay: 60s
        history: 30d
        trends: '0'
        value_type: TEXT
        description: |
          Username associated with the connected
          OpenVPN client.

          Depending on authentication mode, the username
          may differ from the certificate common name.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      # -------------------------------------------------
      # Assigned virtual addresses
      # -------------------------------------------------

      - uuid: 0329f5bf3fb94bdaa30c0e412bc337f8
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Virtual IP Address (IPv6)'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},virtual_addr6]'
        delay: 60s
        history: 30d
        trends: '0'
        value_type: TEXT
        description: |
          IPv6 address assigned to the connected client.

          This field may be empty when the server
          does not assign IPv6 addresses.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      - uuid: 1c21ccdd3bf14aa3b8b65986b5317f6a
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Virtual IP Address'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue,{#UNIQUEID},virtual_addr]'
        delay: 60s
        history: 30d
        trends: '0'
        value_type: TEXT
        description: |
          IPv4 address assigned by the OpenVPN server.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      # -------------------------------------------------
      # Client connection identifiers
      # -------------------------------------------------

      - uuid: 15192106b2164e0e9df447ba330007db
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Client ID'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue_numeric,{#UNIQUEID},client_id]'
        delay: 60s
        history: 30d
        trends: '0'
        description: |
          Numeric OpenVPN client identifier.

          Returns zero when no identifier is available,
          provided the PHP lookup function handles
          missing connections correctly.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'

      - uuid: de719e75d02440fe96c987bd5ddcb367
        name: 'OpenVPN Server {#SERVERNAME}, Client {#USERID}: Peer ID'
        type: ZABBIX_ACTIVE
        key: 'pfsense.value[openvpn_server_uservalue_numeric,{#UNIQUEID},peer_id]'
        delay: 60s
        history: 30d
        trends: '0'
        description: |
          Numeric OpenVPN peer identifier.

          Returns zero when no identifier is available,
          provided the PHP lookup function handles
          missing connections correctly.

        tags:
        - tag: Application
          value: 'OpenVPN Server Clients'
